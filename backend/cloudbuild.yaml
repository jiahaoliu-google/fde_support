steps:
# Step 1: Build the Backend Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [ 'build', '-t', 'us-central1-docker.pkg.dev/fde-support-sandbox-dev-jliu/fde-support-repo/backend:latest', '-f', 'backend/Dockerfile', '.' ]

# Step 2: Deploy & update Cloud Run backend service
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'fde-support-backend'
  - '--image'
  - 'us-central1-docker.pkg.dev/fde-support-sandbox-dev-jliu/fde-support-repo/backend:latest'
  - '--region'
  - 'us-central1'
  - '--platform'
  - 'managed'

images:
- 'us-central1-docker.pkg.dev/fde-support-sandbox-dev-jliu/fde-support-repo/backend:latest'
