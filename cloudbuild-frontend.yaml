# _TAG: immutable per-build tag (git SHA) so deploy.sh resolves the exact digest it built.
substitutions:
  _TAG: manual

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build',
           '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/fde-support-repo/frontend:latest',
           '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/fde-support-repo/frontend:${_TAG}',
           '-f', 'frontend/Dockerfile', '.']

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/fde-support-repo/frontend:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/fde-support-repo/frontend:${_TAG}'
