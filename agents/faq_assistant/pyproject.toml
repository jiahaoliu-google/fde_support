[project]
name = "fde-support-faq-assistant"
version = "0.1.0"
description = "FAQ Assistant Agent for FDE Support System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[gcp]>=2.10.0,<3",
    "google-cloud-aiplatform>=1.70.0",
    "google-genai>=0.1.1",
    "google-cloud-discoveryengine>=0.13.0",
    "google-auth[cryptography,requests]>=2.46.0",
    "google-api-core>=2.25.0",
    "pydantic>=2.0.0",
    "certifi>=2023.7.22",
    "uvicorn>=0.22.0",
    "fastapi>=0.100.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
